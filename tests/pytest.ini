[pytest]
# The user's site-packages has the dash pytest plugin (dash 3.x), which imports flask (not installed) and stops
# pytest at startup; anyio (installed 2 Nov 2026) ships one that needs pytest >= 7, the system has 6.2.5. Both are
# unrelated to this project: keep them out. Blocking a plugin that is not installed is a no-op.
addopts = -p no:dash -p no:anyio
cache_dir = ../.pytest_cache
